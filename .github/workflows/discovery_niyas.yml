name: Career Discovery (Niyas)

on:
  schedule:
    # 3 times daily: 02:00, 10:00, 18:00 UTC (06:00, 14:00, 22:00 GST / 07:30, 15:30, 23:30 IST)
    # Balanced cadence to discover fresh jobs across US, UK, Europe, UAE, and APAC timezones
    # while preserving Jooble and Adzuna API limits.
    - cron: "0 2,10,18 * * *"
  workflow_dispatch:

concurrency:
  group: career-discovery-niyas
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run discovery
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CAREER_ANALYZER_URL: ${{ secrets.CAREER_ANALYZER_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node discovery_niyas.mjs
